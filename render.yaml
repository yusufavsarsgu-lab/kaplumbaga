databases:
  - name: kaplumbaga-db
    plan: free
    databaseName: kaplumbaga
    user: kaplumbaga

services:
  - type: web
    name: kaplumbaga-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build:render
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://kaplumbaga-chat.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: kaplumbaga-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: SEED_YUSUF_PASSWORD
        value: "123456"
      - key: SEED_NEEJA_PASSWORD
        value: "123456"
